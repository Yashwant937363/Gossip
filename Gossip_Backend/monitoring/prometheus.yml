global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "gossip-backend"
    scheme: __BACKEND_SCHEME__
    metrics_path: /metrics
    static_configs:
      - targets: ["__BACKEND_DOMAIN__"]
